<text x="400" y="23" text-anchor="middle" font-size="12" fill="#8b949e">root@node1: ~ — meridian full</text>
<text y="74"><tspan x="24.0" fill="#58a6ff"># </tspan><tspan x="39.6" fill="#c9d1d9" font-weight="700">meridian full</tspan></text>
<text y="118"><tspan x="24.0" fill="#c9d1d9">Сменить пароль root перед установкой? [Y/n]: </tspan><tspan x="375.0" fill="#c9d1d9" font-weight="700">y</tspan></text>
<text y="140"><tspan x="24.0" fill="#c9d1d9">Добавить ноду в панель автоматически по API (нужен токен)? [Y/n]: </tspan><tspan x="538.8" fill="#c9d1d9" font-weight="700">y</tspan></text>
<text y="162"><tspan x="24.0" fill="#c9d1d9">URL панели (https://panel.example.com): </tspan><tspan x="336.0" fill="#c9d1d9" font-weight="700">https://panel.example.com</tspan></text>
<text y="184"><tspan x="24.0" fill="#c9d1d9">API-токен панели (в панели: Настройки -&gt; API токены): </tspan></text>
<text y="206"><tspan x="24.0" fill="#c9d1d9">Домен ноды (например node1.example.com): </tspan><tspan x="343.8" fill="#c9d1d9" font-weight="700">node1.example.com</tspan></text>
<text y="250"><tspan x="24.0" fill="#3fb950">[+]</tspan><tspan x="47.4" fill="#c9d1d9"> SECRET_KEY получен из панели по API.</tspan></text>
<text y="272"><tspan x="24.0" fill="#3fb950">[+]</tspan><tspan x="47.4" fill="#c9d1d9"> UFW настроен и включён.</tspan></text>
<text y="294"><tspan x="24.0" fill="#3fb950">[+]</tspan><tspan x="47.4" fill="#c9d1d9"> ICMP заблокирован (бэкап правил: /etc/ufw/before.rules.bak.*).</tspan></text>
<text y="316"><tspan x="24.0" fill="#3fb950">[+]</tspan><tspan x="47.4" fill="#c9d1d9"> nginx установлен.</tspan></text>
<text y="338"><tspan x="24.0" fill="#3fb950">[+]</tspan><tspan x="47.4" fill="#c9d1d9"> Создание страницы-заглушки (</tspan><tspan x="273.6" fill="#39c5cf">status</tspan><tspan x="320.4" fill="#c9d1d9">)...</tspan></text>
<text y="360"><tspan x="24.0" fill="#3fb950">[+]</tspan><tspan x="47.4" fill="#c9d1d9"> Сертификат выпущен.</tspan></text>
<text y="382"><tspan x="24.0" fill="#3fb950">[+]</tspan><tspan x="47.4" fill="#c9d1d9"> nginx настроен и перезапущен.</tspan></text>
<text y="404"><tspan x="24.0" fill="#3fb950">[+]</tspan><tspan x="47.4" fill="#c9d1d9"> remnanode запущен. Логи: docker compose -f /opt/remnanode/docker-compose.yml logs -f</tspan></text>
<text y="426"><tspan x="24.0" fill="#3fb950">[+]</tspan><tspan x="47.4" fill="#c9d1d9"> Создаю профиль Node 1, теги: </tspan><tspan x="281.4" fill="#39c5cf">node1</tspan></text>
<text y="448"><tspan x="24.0" fill="#3fb950">[+]</tspan><tspan x="47.4" fill="#c9d1d9"> Нода Node 1 (node1.example.com:2222) добавлена в панель, все инбаунды включены.</tspan></text>
<text y="470"><tspan x="24.0" fill="#3fb950">[+]</tspan><tspan x="47.4" fill="#c9d1d9"> </tspan><tspan x="55.2" fill="#c9d1d9" font-weight="700">Базовая установка ноды завершена.</tspan></text>
