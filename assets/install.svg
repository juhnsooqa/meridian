      .t   { fill: #c9d1d9; }
      .dim { fill: #8b949e; }
      .gr  { fill: #3fb950; }
      .ye  { fill: #d29922; }
      .cy  { fill: #39c5cf; }
      .b   { font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" width="800" height="470" rx="10"/>
  <path class="bar" d="M0 10a10 10 0 0 1 10-10h780a10 10 0 0 1 10 10v26H0z"/>
