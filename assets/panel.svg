<svg xmlns="http://www.w3.org/2000/svg" width="800" height="376" viewBox="0 0 800 376" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5">
