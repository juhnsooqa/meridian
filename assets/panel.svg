  <text x="24" y="236"><tspan class="t">Имя профиля и ноды в панели [node1]: </tspan><tspan class="t b">Node 1</tspan></text>
  <text x="24" y="258"><tspan class="t">Код страны ноды (2 буквы) [XX]: </tspan><tspan class="t b">FI</tspan></text>

  <text x="24" y="290"><tspan class="gr b">[+]</tspan><tspan class="t"> psiphon-out направлен на 172.17.0.1:1080.</tspan></text>
  <text x="24" y="312"><tspan class="gr b">[+]</tspan><tspan class="t"> Создаю профиль Node 1, теги: </tspan><tspan class="cy">node1</tspan></text>
  <text x="24" y="334"><tspan class="gr b">[+]</tspan><tspan class="t"> Нода Node 1 (node1.example.com:2222) добавлена, инбаунды включены.</tspan></text>
  <text x="24" y="358"><tspan class="ye b">[!]</tspan><tspan class="t"> Хосты скрипт не создаёт — настройки в panel-hosts.txt</tspan></text>
