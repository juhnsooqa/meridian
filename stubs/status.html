<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System status</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f6f8fa;color:#1f2328;padding:48px 24px}
.w{max-width:620px;margin:0 auto;background:#fff;border:1px solid #d0d7de;border-radius:10px;padding:28px}h1{font-size:20px;margin:0 0 20px}.r{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0f2f4;font-size:15px}.r:last-child{border:0}.ok{color:#1a7f37;font-size:14px}.d{color:#8b949e;font-size:13px;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="w">
<h1>All systems operational</h1>
<div class="r"><span>Website</span><span class="ok">● Operational</span></div>
<div class="r"><span>API</span><span class="ok">● Operational</span></div>
<div class="r"><span>Database</span><span class="ok">● Operational</span></div>
<div class="r"><span>CDN</span><span class="ok">● Operational</span></div>
<p class="d">Uptime over the last 90 days: 99.98%</p>
</div>
</body>
</html>
