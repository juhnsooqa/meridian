<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#fff;color:#1a1a1a;padding:40px 24px}
.w{max-width:900px;margin:0 auto}h1{font-size:22px;letter-spacing:3px;text-transform:uppercase;margin:0 0 28px;text-align:center}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px}.p .i{aspect-ratio:1;background:#f2f0ed;border-radius:6px}.p h3{font-size:15px;font-weight:500;margin:12px 0 4px}.p span{color:#888;font-size:14px}.n{margin-top:40px;text-align:center;color:#999;font-size:14px}
</style>
</head>
<body>
<div class="w">
<h1>Shop</h1>
<div class="g">
<div class="p"><div class="i"></div><h3>Linen shirt</h3><span>€89</span></div>
<div class="p"><div class="i"></div><h3>Wool scarf</h3><span>€45</span></div>
<div class="p"><div class="i"></div><h3>Canvas bag</h3><span>€60</span></div>
<div class="p"><div class="i"></div><h3>Cotton socks</h3><span>€12</span></div>
</div>
<p class="n">Online orders open soon.</p>
</div>
</body>
</html>
