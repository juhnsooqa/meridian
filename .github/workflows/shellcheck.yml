name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SC1090: state-файлы source-ятся по переменной пути, это намеренно
      - run: shellcheck -S warning -e SC1090 meridian.sh remnawave-node-setup.sh psiphon/psiphon_install.sh
