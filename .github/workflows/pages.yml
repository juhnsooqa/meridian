name: pages

# Вики на https://juhnsooqa.github.io/meridian/ (MkDocs Material).
# Один раз включить: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: [docs/**, assets/**, overrides/**, mkdocs.yml, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      # картинки живут в assets/ для README, вики берёт те же файлы, а не копию в репо
      - run: cp -r assets docs/assets && mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
